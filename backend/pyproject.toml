[project]
name = "qwen-live-translate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.137,<1",
  "uvicorn[standard]>=0.49,<1",
  "pydantic-settings>=2.10,<3",
  "websockets>=15,<18",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "jsonschema>=4,<5",
    "mypy>=1.19,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_untyped_imports = true
plugins = ["pydantic.mypy"]
files = ["."]
exclude = ["^tests/"]
